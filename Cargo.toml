[workspace]
resolver = "3"
members = [
    "crates/nexus-types",
    "crates/nexus-crypto",
    "crates/nexus-protocol",
    "crates/nexus-identity",
    "crates/nexus-store",
    "crates/nexus-transfer",
    "crates/nexus-net",
    "crates/nexus-search",
    "crates/nexus-core",
    "crates/nexus-ffi",
    "crates/nexus-observability",
    "crates/nexus-testkit",
]
default-members = ["crates/nexus-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
nexus-core = { path = "crates/nexus-core" }
nexus-crypto = { path = "crates/nexus-crypto" }
nexus-identity = { path = "crates/nexus-identity" }
nexus-net = { path = "crates/nexus-net" }
nexus-observability = { path = "crates/nexus-observability" }
nexus-protocol = { path = "crates/nexus-protocol" }
nexus-search = { path = "crates/nexus-search" }
nexus-store = { path = "crates/nexus-store" }
nexus-testkit = { path = "crates/nexus-testkit" }
nexus-transfer = { path = "crates/nexus-transfer" }
nexus-types = { path = "crates/nexus-types" }
argon2 = { version = "0.6.0", features = ["zeroize"] }
bech32 = "0.12.0"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
ciborium = "0.2.2"
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
fs2 = "0.4.3"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
rusqlite = { version = "0.42.0", default-features = false, features = [
    "backup",
    "bundled",
    "fallible_uint",
] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "ansi",
    "env-filter",
    "fmt",
] }
unicode-normalization = "0.1.26"
zeroize = { version = "1.9.1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
