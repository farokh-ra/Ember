[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
# Workspace crates are unpublished and marked publish = false. They do not need
# an SPDX license expression until the project chooses and publishes a license.
private = { ignore = true }
# The allowlist is the approved policy for future direct and transitive
# dependencies. An approved license that is not currently present is not a
# failure.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no registry version requirement. They are
# private crates, so allow wildcard requirements for path dependencies while
# still rejecting wildcard registry requirements.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
