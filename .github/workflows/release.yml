name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (MAJOR.MINOR.PATCH)"
        required: true
        default: "0.1.0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RUST_BACKTRACE: "1"

jobs:
  package:
    name: Build signed release artifacts
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Install Rust 1.99.1 with Android targets
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version '$version' is not MAJOR.MINOR.PATCH."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore Android signing material
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            throw "ANDROID_KEYSTORE_BASE64 is not configured. Signed releases require a production keystore."
          }
          $path = Join-Path $env:RUNNER_TEMP "ember-release.jks"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          "EMBER_ANDROID_KEYSTORE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)) {
            throw "WINDOWS_PFX_BASE64 is not configured. Signed releases require a code-signing certificate."
          }
          $path = Join-Path $env:RUNNER_TEMP "ember-release.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $password = ConvertTo-SecureString -String $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "EMBER_WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch pinned WiX toolset
        shell: pwsh
        run: |
          $wix = & .\scripts\fetch-wix.ps1
          "WIX_DIR=$wix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build signed APK, AAB, MSI, and portable package
        shell: pwsh
        env:
          EMBER_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          EMBER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EMBER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EMBER_TIMESTAMP_URL: ${{ vars.EMBER_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $env:PATH = "$env:WIX_DIR;$env:PATH"
          .\scripts\package-release.ps1 -Version "${{ steps.release.outputs.version }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ember-release-${{ steps.release.outputs.version }}
          path: dist/${{ steps.release.outputs.version }}/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $directory = "dist/${{ steps.release.outputs.version }}"
          gh release create "${{ github.ref_name }}" (Get-ChildItem $directory -File | ForEach-Object FullName) `
            --title "Ember ${{ steps.release.outputs.version }}" `
            --generate-notes
