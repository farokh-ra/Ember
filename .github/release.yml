changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Security and dependencies
      labels:
        - security
        - dependencies
    - title: Build and CI
      labels:
        - build
        - ci
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
