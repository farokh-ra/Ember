name: Bug report
description: Report a reproducible defect in NEXUS.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private keys, recovery phrases, or personal data.
        Use the security policy for vulnerabilities instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reproduces the problem.
      placeholder: |
        1. Build commit ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
        - Rust core
        - Build or CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove paths, peer IDs, credentials, and personal data.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have removed secrets and personal data from this report.
          required: true
